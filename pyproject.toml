[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "simple_triton"
authors = [
    {name = "Lee Cooper", email = "lee.cooper@northwestern.edu"},
]
description = "A simple and efficient python client for the Triton Inference Server."
readme = "README.md"
repository = "https://github.com/PathologyDataScience/simple_triton"
requires-python = ">=3.7"
keywords = ["one", "two"]
license = {text = "Apache-2.0"}
dependencies = [
    "numpy>=1.21",
    "tabulate",
    "tritonclient>=2.30.0"
]
dynamic = ["version"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tox]
envlist = 
  py{37,38,39,310,311}
  lint
toxworkdir = {tox_root}/.tox
skip_missing_interpreters = true

[testenv]
deps =
  coverage
  pytest
commands =
    python3 -m coverage run --branch pytest {posargs:tests}

[testenv:lint]
deps =
  black
commands = black {posargs:.}
