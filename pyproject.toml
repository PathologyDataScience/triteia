[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "simple_triton"
authors = [
    {name = "Lee Cooper", email = "lee.cooper@northwestern.edu"},
]
description = "A simple and efficient python client for the Triton Inference Server."
readme = "README.md"
requires-python = ">=3.9"
keywords = ["mlops", "digital pathology"]
license = {text = "Apache-2.0"}
dependencies = [
    "grpcio",
    #"histomics-stream", # install manually until 2.5.0 is on pip
    "numpy",
    "large-image[tiff]",
    "pandas",
    "psutil",
    "pooch",
    "protobuf",
    "tensorflow-cpu<2.16",
    "tensorboardX",
    "tqdm",
    "tritonclient[all]"
]
dynamic = ["version"]

[project.optional-dependencies]
examples = ["pooch"]

[project.scripts]
inference = "simple_triton.feature_extraction:main"

[tool.setuptools]
packages = ["simple_triton", "simple_triton.io"]

[tool.setuptools_scm]

[project.urls]
"Github" = "https://github.com/PathologyDataScience/simple_triton"


