[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "triteia"
authors = [
{name = "Lee Cooper", email = "lee.cooper@northwestern.edu"},
]
description = "A simple and efficient python client for the Triton Inference Server."
readme = "README.md"
requires-python = ">=3.9"
keywords = ["mlops", "digital pathology"]
license = "Apache-2.0"
dependencies = [
  "grpcio",
  "histomics-stream",
  "numpy",
  "large-image[tiff]",
  "pandas",
  "psutil",
  "pooch",
  "protobuf",
  "tensorflow",
  "tensorboardX",
  "tqdm",
  "tritonclient[all]"
]
dynamic = ["version"]

[project.optional-dependencies]
examples = [
  "ipywidgets",
  "jupyterlab",
  "matplotlib",
  "medmnist@git+https://github.com/andsild/MedMNIST-no-gpu",
  "monai",
  "onnxscript",
  "pooch",
  "scikit-learn",
  "umap-learn",
  "widgetsnbextension",
  "zarr"
]

[project.scripts]
inference = "triteia.feature_extraction:main"

[tool.setuptools]
packages = ["triteia", "triteia.io"]

[tool.setuptools_scm]

[project.urls]
"Github" = "https://github.com/PathologyDataScience/triteia"


