[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "simple_triton"
authors = [
    {name = "Lee Cooper", email = "lee.cooper@northwestern.edu"},
]
description = "A simple and efficient python client for the Triton Inference Server."
readme = "README.md"
requires-python = ">=3.7"
keywords = ["mlops", "digital pathology"]
license = {text = "Apache-2.0"}
dependencies = [
    "mil @ git+https://github.com/PathologyDataScience/mil.git@dev",
    "numpy>=1.21",
    "protobuf",
    "tabulate",
    "tensorflow<2.16",
    "tritonclient[all]>=2.30.0",
]
dynamic = ["version"]

[project.optional-dependencies]
examples = ["pooch"]

[project.scripts]
inference = "simple_triton.inference:main"

[tool.setuptools]
packages = ["simple_triton"]

[tool.setuptools_scm]

[project.urls]
"Github" = "https://github.com/PathologyDataScience/simple_triton"
