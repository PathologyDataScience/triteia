[tox]
envlist = 
  py{38,39,310,311}
  report
  lint
toxworkdir = {tox_root}/.tox
skip_missing_interpreters = true

[testenv]
deps =
  coverage
  pytest
  pytest-cov
commands =
    pytest --cov --cov-config tox.ini {posargs:tests}

[testenv:lint]
deps =
  black
commands = black {posargs:.}

[testenv:report]
deps = coverage
commands =
    coverage report
    coverage html

[testenv:clean]
deps = coverage
skip_install = true
commands = coverage erase

[tool:pytest]
minversion = 6.0
addopts = -ra -q --cov-report=term-missing --cov-append
testpaths =
    tests

[coverage:run]
concurrency = multiprocessing
include = 
    triteia/*
    {envsitepackagesdir}/triteia/*
omit =
    tests/*

[coverage:paths]
source =
  triteia/
  {envsitepackagesdir}/triteia/

[coverage:html]
directory = .tox/coverage/coverage.html
